<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LLD Practice Platform</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 1.4rem; }
  nav button { margin-right: 8px; padding: 6px 14px; cursor: pointer; }
  .problem-card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
  .problem-card:hover { background: #f7f7f7; }
  textarea { width: 100%; height: 260px; font-family: monospace; font-size: 0.95rem; padding: 10px; box-sizing: border-box; }
  .score { font-weight: bold; }
  .status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; color: white; }
  .PENDING, .EVALUATING { background: #d19a00; }
  .COMPLETED { background: #1a8a3c; }
  .FAILED { background: #c0392b; }
  .hidden { display: none; }
  .muted { color: #777; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; }
  button.primary { background: #1a1a1a; color: white; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  button.link { background: none; border: none; color: #1a56db; cursor: pointer; padding: 0; font-size: 0.9rem; text-decoration: underline; }

  .rubric-table td, .rubric-table th { padding: 8px 10px; }
  .rubric-table th { background: #f7f7f7; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: #555; }
  .verdict-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }
  .verdict-strength { background: #e3f6e8; color: #1a8a3c; }
  .verdict-weakness { background: #fbe9e7; color: #c0392b; }
  .verdict-mixed { background: #fff4e0; color: #a66a00; }

  .criterion-row { cursor: pointer; }
  .criterion-row:hover { background: #f7f9fc; }
  .expand-arrow { display: inline-block; width: 1em; transition: transform 0.15s ease; color: #999; }
  .detail-row td { background: #fafbfd; padding: 0; border-bottom: 1px solid #eee; }
  .criterion-detail { padding: 10px 16px 14px 16px; }

  .suggestions-box { background: #f0f7ff; border: 1px solid #cfe3fc; border-radius: 8px; padding: 14px 16px; margin-top: 14px; }
  .suggestions-box h4 { margin: 0 0 8px 0; font-size: 0.9rem; }
  .suggestions-list { margin: 0; padding-left: 20px; }
  .suggestions-list li { margin-bottom: 10px; }
  .suggestions-list li:last-child { margin-bottom: 0; }
  .suggestion-criterion { font-weight: 600; }

  .reopened-banner { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>LLD Practice Platform</h1>
<nav>
  <button onclick="showView('problems')">Problems</button>
  <button onclick="showView('history')">History</button>
</nav>

<section id="view-problems">
  <h2>Choose a problem</h2>
  <div id="problem-list"></div>
</section>

<section id="view-practice" class="hidden">
  <button onclick="showView('problems')">&larr; Back</button>
  <h2 id="practice-title"></h2>
  <div id="reopened-banner" class="reopened-banner hidden"></div>
  <p id="practice-prompt" class="muted"></p>
  <p><strong>Requirements:</strong></p>
  <pre id="practice-requirements" class="muted"></pre>
  <p><strong>Constraints:</strong></p>
  <pre id="practice-constraints" class="muted"></pre>
  <textarea id="submission-text" placeholder="Describe your classes, their responsibilities, relationships, and reasoning..."></textarea>
  <br><br>
  <button class="primary" onclick="submitSolution()">Submit</button>
  <span id="submit-status" class="muted"></span>

  <div id="feedback-area"></div>
</section>

<section id="view-history" class="hidden">
  <h2>Your attempt history</h2>
  <table>
    <thead><tr><th>Problem</th><th>Version</th><th>Status</th><th>Avg Score</th><th></th></tr></thead>
    <tbody id="history-body"></tbody>
  </table>
</section>

<script>
let currentAttemptId = null;
let currentProblem = null;
let pollHandle = null;

const CRITERION_LABELS = {
  requirement_understanding: "Requirement Understanding",
  class_responsibilities: "Class Responsibilities",
  coupling_cohesion: "Coupling / Cohesion",
  encapsulation_interfaces: "Encapsulation & Interfaces",
  extensibility: "Extensibility",
  edge_cases: "Edge Cases & Testability",
};

function criterionLabel(key) {
  return CRITERION_LABELS[key] || key;
}

function verdictFor(score) {
  if (score >= 4) return { label: "Strength", cls: "verdict-strength" };
  if (score <= 2) return { label: "Weakness", cls: "verdict-weakness" };
  return { label: "Mixed", cls: "verdict-mixed" };
}

function showView(name) {
  ['problems', 'practice', 'history'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('hidden', v !== name);
  });
  if (name === 'problems') loadProblems();
  if (name === 'history') loadHistory();
}

async function loadProblems() {
  const res = await fetch('/api/problems');
  const problems = await res.json();
  const list = document.getElementById('problem-list');
  list.innerHTML = '';
  problems.forEach(p => {
    const div = document.createElement('div');
    div.className = 'problem-card';
    div.innerHTML = `<strong>${p.title}</strong><p class="muted">${p.prompt}</p>`;
    div.onclick = () => startAttempt(p);
    list.appendChild(div);
  });
}

function fillProblemPanel(problem) {
  document.getElementById('practice-title').innerText = problem.title;
  document.getElementById('practice-prompt').innerText = problem.prompt;
  document.getElementById('practice-requirements').innerText = problem.requirements;
  document.getElementById('practice-constraints').innerText = problem.constraints;
}

async function startAttempt(problem) {
  currentProblem = problem;
  const res = await fetch('/api/attempts', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({problem_id: problem.id})
  });
  const attempt = await res.json();
  currentAttemptId = attempt.id;

  fillProblemPanel(problem);
  document.getElementById('reopened-banner').classList.add('hidden');
  document.getElementById('submission-text').value = '';
  document.getElementById('feedback-area').innerHTML = '';
  document.getElementById('submit-status').innerText = '';
  showView('practice');
}

async function submitSolution() {
  const content = document.getElementById('submission-text').value;
  if (content.trim().length === 0) { alert('Write something first.'); return; }

  document.getElementById('submit-status').innerText = 'Submitting...';
  const res = await fetch(`/api/attempts/${currentAttemptId}/submissions`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({content})
  });
  const submission = await res.json();
  document.getElementById('submit-status').innerText = 'Submitted — evaluating...';
  pollEvaluation(submission.id);
}

async function pollEvaluation(submissionId) {
  if (pollHandle) clearInterval(pollHandle);
  pollHandle = setInterval(async () => {
    const res = await fetch(`/api/attempts/${currentAttemptId}/submissions/${submissionId}/evaluation`);
    if (res.status !== 200) return;
    const ev = await res.json();
    renderFeedback(ev);
    if (ev.status === 'COMPLETED' || ev.status === 'FAILED') {
      clearInterval(pollHandle);
      document.getElementById('submit-status').innerText = '';
    }
  }, 1500);
}

function renderFeedback(ev) {
  const area = document.getElementById('feedback-area');
  let html = `<h3>Evaluation <span class="status-badge ${ev.status}">${ev.status}</span></h3>`;

  if (ev.status === 'FAILED') {
    html += `<p class="muted">${ev.error_message || 'Evaluation failed.'}</p>`;
  } else if (ev.status === 'COMPLETED') {
    html += `<p>${ev.overall_summary || ''}</p>`;

    html += `<table class="rubric-table"><thead><tr>
      <th></th><th>Criterion</th><th>Score</th><th>Verdict</th>
    </tr></thead><tbody>`;
    ev.feedback_items.forEach(item => {
      const v = verdictFor(item.score);
      const key = item.criterion;
      html += `<tr class="criterion-row" onclick="toggleCriterionRow('${key}')">
        <td class="expand-arrow" id="arrow-${key}">&rsaquo;</td>
        <td>${criterionLabel(item.criterion)}</td>
        <td class="score">${item.score}/5</td>
        <td><span class="verdict-badge ${v.cls}">${v.label}</span></td>
      </tr>
      <tr class="detail-row hidden" id="detail-row-${key}">
        <td colspan="4">
          <div class="criterion-detail">
            <div><b>Evidence</b>: ${item.evidence}</div>
            ${item.concern ? `<div><b>Concern</b>: ${item.concern}</div>` : ''}
            ${item.suggestion ? `<div><b>Suggestion</b>: ${item.suggestion}</div>` : ''}
          </div>
        </td>
      </tr>`;
    });
    html += `</tbody></table>`;

    html += renderSuggestions(ev.feedback_items);
  } else {
    html += `<p class="muted">Working on it...</p>`;
  }
  area.innerHTML = html;
}

function toggleCriterionRow(key) {
  const detailRow = document.getElementById(`detail-row-${key}`);
  const arrow = document.getElementById(`arrow-${key}`);
  const opening = detailRow.classList.contains('hidden');
  detailRow.classList.toggle('hidden');
  arrow.style.transform = opening ? 'rotate(90deg)' : 'rotate(0deg)';
}

function renderSuggestions(items) {
  const withSuggestions = items
    .filter(item => item.suggestion && item.score < 5)
    .sort((a, b) => a.score - b.score);

  if (withSuggestions.length === 0) {
    return `<div class="suggestions-box">
      <h4>Suggestions to improve your score</h4>
      <p class="muted">No specific suggestions — this submission scored well across every criterion.</p>
    </div>`;
  }

  const rows = withSuggestions.map(item => `
    <li>
      <span class="suggestion-criterion">${criterionLabel(item.criterion)}</span>
      <div>${item.suggestion}</div>
    </li>
  `).join('');

  return `<div class="suggestions-box">
    <h4>Suggestions to improve your score</h4>
    <ol class="suggestions-list">${rows}</ol>
  </div>`;
}

async function loadHistory() {
  const res = await fetch('/api/history');
  const rows = await res.json();
  const body = document.getElementById('history-body');
  body.innerHTML = '';
  rows.forEach(r => {
    const ev = r.latest_evaluation;
    let avgScore = '-';
    if (ev && ev.feedback_items && ev.feedback_items.length > 0) {
      const total = ev.feedback_items.reduce((s, i) => s + i.score, 0);
      avgScore = (total / ev.feedback_items.length).toFixed(1);
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.problem_title}</td>
      <td>v${r.latest_submission ? r.latest_submission.version : '-'}</td>
      <td><span class="status-badge ${ev ? ev.status : ''}">${ev ? ev.status : 'N/A'}</span></td>
      <td>${avgScore}</td>
      <td><button onclick="reopenAttempt('${r.attempt_id}', '${r.problem_id}')">Reopen</button></td>
    `;
    body.appendChild(tr);
  });
}


async function reopenAttempt(attemptId, problemId) {
  const [problemRes, submissionsRes] = await Promise.all([
    fetch(`/api/problems/${problemId}`),
    fetch(`/api/attempts/${attemptId}/submissions`),
  ]);
  const problem = await problemRes.json();
  const submissions = await submissionsRes.json();

  currentAttemptId = attemptId;
  currentProblem = problem;
  fillProblemPanel(problem);

  const banner = document.getElementById('reopened-banner');
  const feedbackArea = document.getElementById('feedback-area');
  const textarea = document.getElementById('submission-text');

  if (submissions.length === 0) {
    banner.classList.add('hidden');
    textarea.value = '';
    feedbackArea.innerHTML = '<p class="muted">No submissions on this attempt yet.</p>';
    showView('practice');
    return;
  }

  const latest = submissions[submissions.length - 1];
  textarea.value = latest.content;
  banner.classList.remove('hidden');
  banner.innerText = `Reviewing your v${latest.version} submission. Edit and press Submit to try again (this creates a new version).`;
  feedbackArea.innerHTML = '<p class="muted">Loading feedback...</p>';

  const evalRes = await fetch(`/api/attempts/${attemptId}/submissions/${latest.id}/evaluation`);
  if (evalRes.status === 200) {
    const ev = await evalRes.json();
    renderFeedback(ev);
  } else {
    feedbackArea.innerHTML = '<p class="muted">No evaluation found for this submission.</p>';
  }

  showView('practice');
}

showView('problems');
</script>
</body>
</html>
